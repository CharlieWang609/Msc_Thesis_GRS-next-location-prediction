[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mamba-next-location-thesis"
version = "1.0.0"
description = "Mobility simulation and next-location prediction experiments for an MSc thesis"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "Apache-2.0"
authors = [
  { name = "Changling Wang" },
]
keywords = [
  "human mobility",
  "next-location prediction",
  "mamba",
  "mobility simulation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "easydict>=1.10",
  "geopandas>=0.13",
  "joblib>=1.3",
  "networkx>=3.1",
  "numpy>=1.24,<2",
  "pandas>=2.0,<3",
  "powerlaw>=1.5",
  "pyyaml>=6",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "shapely>=2",
  "torch>=2.1",
  "tqdm>=4.65",
  "trackintel==1.2.2",
  "transformers>=4.35",
]

[project.optional-dependencies]
analysis = [
  "contextily>=1.4",
  "jupyterlab>=4",
  "matplotlib>=3.7",
  "thop>=0.1.1.post2209072238",
]
database = [
  "psycopg2-binary>=2.9",
  "sqlalchemy>=2",
]
mamba = [
  "mamba-ssm>=2.2",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["archive", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
